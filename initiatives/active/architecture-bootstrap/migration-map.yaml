# Migration map (§8.2).
#
# One entry per proposed move or reduction. Nothing is edited in a governed
# repository before Gate 1 approves this file.
#
# action values:
#   centralize-and-generate-local-baseline  the text becomes a central standard;
#                                           the local file keeps a generated
#                                           managed section and its own rules
#   centralize-and-link                     the text becomes a central standard;
#                                           the local file links it
#   reduce-and-link                         the local file keeps a short local
#                                           form and links the central standard
#   relocate-local                          the text stays in its repository but
#                                           moves to the §5.10 layout
#   keep                                    the text stays where it is, unchanged
#   generate                                the file becomes a generated artifact
#   decide                                  needs an explicit decision record

