nomadtty:
  governed: false
  decided_by: operator
  at: "2026-08-22T06:20:00Z"
  decision_record: decisions/007-nomadtty-is-governed-by-upstream.md
  merged_as: https://github.com/hannosirkel/architecture/pull/4
  closed_unmerged:
    - https://github.com/hannosirkel/nomadtty/pull/1
    - https://github.com/hannosirkel/nomadtty/pull/2
  reason: >-
    A maintained fork of shifulegend/nomadtty. Every governance file this
    universe would add is a divergence a later upstream merge has to reconcile,
    in a repository whose conventions are upstream's to set. Catalogued so its
    ownership and boundary are known; conformance tooling skips it.
  still_applies: >-
    It is public, and it must not hold Orange credentials or private host
    details. Ownership facts, not governance mechanics.

audit_after_branch_protection_floor:
  status: applied
  applied_at: "2026-08-22T22:05:00Z"
  result: >-
    One ruleset on each of the six public governed repositories. deploys,
    plepic and robobook already had one, so required_status_checks was added to
    what was there rather than creating a second overlapping ruleset; that
    preserved the approval counts the operator had set. mihkel and ai-portal
    had none and got the full floor. servitium was already at it.
  deploys_exception: >-
    No pull_request rule. Its main receives automated digest pushes from the
    plepic and servitium release workflows.
  what_actually_blocked_it: >-
    Not the token. A GitHub App permission change stays a pending request until
    the installation accepts it, and a freshly minted token does not carry it
    until then. Re-minting was tried first and did not help. The tell was
    X-Accepted-Github-Permissions: administration=write on a 403 against a
    sixty-second-old token.
  operator_delegated: true
  blocked_by: >-
    GitHub returns 403 "Resource not accessible by integration" on POST
    /repos/{owner}/{repo}/rulesets. Reproduced on ai-portal and mihkel, so it is
    the installation and not one repository. The app can read rulesets and
    cannot write them; it needs Administration: Read and write.
  operator_options:
    - grant the installation Administration write, then this can be applied
    - apply the five rulesets in the GitHub UI
  payload_ready: >-
    scratchpad ruleset-ai-portal.json holds the exact shape: deletion,
    non_fast_forward, pull_request with required_approving_review_count 0, and
    required_status_checks with strict false and integration_id 15368.
  choices_made:
    required_approving_review_count: >-
      0 for the repositories gaining the rule. The floor's purpose is that no
      agent commits to a default branch, not that a human reviews every
      governance change. plepic and servitium already require 1 and keep it.
    strict_required_status_checks_policy: >-
      false for new rules. servitium has it true, and that is what put its
      wave 2 pull request into BEHIND and cost a cycle. Left as it is there.
  reason: >-
    §13 Gate 2 names a repository ruleset change as needing explicit operator
    authority. A required status check also names a job, and wave 2 is changing
    job names right now, so applying the floor before wave 2 merges would block
    every merge on a context that no longer exists.
  enforcement_is_real: >-
    Verified, not assumed. plepic and servitium require one approving review,
    and the wave 1 pull requests carried one from hannosirkel. The bot has no
    bypass and no admin permission on those repositories.
  private_repositories_cannot_carry_one: >-
    architecture, orange, orange-inventory, myskills, entpass. The rulesets API
    returns 403 on the current plan. Named accepted risk; the written rule plus
    the direct-push audit stand in.
  delta:
    deploys:
      has: [deletion, non_fast_forward]
      add: [required_status_checks]
      never_add: pull_request
      reason: >-
        main receives automated image digest pushes from the plepic and
        servitium release workflows. A pull-request rule breaks promotion.
    plepic:
      has: [deletion, non_fast_forward, "pull_request (1 approval)"]
      add: [required_status_checks]
    robobook:
      has: [deletion, non_fast_forward, "pull_request (0 approvals)"]
      add: [required_status_checks]
    servitium:
      has: [deletion, non_fast_forward, pull_request, required_status_checks]
      add: []
      note: the only repository already at the floor
    mihkel:
      has: []
      add: [deletion, non_fast_forward, pull_request, required_status_checks]
    ai-portal:
      has: []
      add: [deletion, non_fast_forward, pull_request, required_status_checks]

wave_2:
  W2-deploys:
    pr: https://github.com/hannosirkel/deploys/pull/19
    ci: pass
    content: >-
      shellcheck over a runtime-discovered file list, zizmor, markdownlint,
      lychee, and kubeconform pinned to Kubernetes 1.36.2.
    no_manifest_change: >-
      Verified. The only non-CI file touched is servitium/tests/manifests.sh,
      and only to add a comment and one shellcheck directive.
  W2-myskills:
    pr: https://github.com/hannosirkel/myskills/pull/4
    ci: pass
  W2-entpass:
    pr: https://github.com/hannosirkel/entpass/pull/3
    ci: pass
  W2-ai-portal:
    pr: https://github.com/hannosirkel/ai-portal/pull/1
    ci: pass
    no_scaffolding: verified; workflow and two check configs only

  W2-robobook:
    pr: https://github.com/hannosirkel/robobook/pull/7
    merged: true
    ci: pass
    baseline: >-
      173 ruff findings, 157 directives, largest FURB157 x77 and I001 x36.
      No logic changed, checked mechanically: 157 lines removed and 157 added,
      and comparing each pair with the noqa comment stripped gives zero lines
      differing. 237 tests pass before and after.
    note: >-
      ruff.toml needed extend-select E402, because the tests already carried 25
      `# noqa: E402` directives and E402 is not in ruff's defaults — without it
      those 25 were dead and ruff reported them as RUF100.
  W2-mihkel:
    pr: https://github.com/hannosirkel/mihkel/pull/3
    merged: true
    ci: pass
    baseline: 4 ruff directives (I001 x2, RUF012 x2); 1 shellcheck SC2034
    exception: eslint; see the exceptions block in universe/repositories.yaml
    note: >-
      Its actions/checkout pin was an uncommented 11bd719, which resolves to
      v4.2.2 and a deprecated Node runtime. Bumped to v7.0.1 with a true comment.
  W2-plepic:
    pr: https://github.com/hannosirkel/plepic/pull/39
    merged: false
    blocked_on: REVIEW_REQUIRED
    ci: pass
    baseline: >-
      4 shellcheck directives (SC1007 x2 deliberate CDPATH prefix, SC2016 x2
      single-quoted JS for node -e); 506 markdownlint findings; 3 lychee.
    note: eslint confirmed already gated through npm run lint; no second gate added
  W2-servitium:
    pr: https://github.com/hannosirkel/servitium/pull/26
    merged: false
    blocked_on: REVIEW_REQUIRED
    ci: pass
    baseline: 14 shellcheck findings, 8 directives; 11 markdownlint; 0 lychee
    exception: eslint; typescript-eslint peer range excludes typescript 7
    note: >-
      Added the top-level permissions block deploy-test.yml was missing, which
      the top-tier review found the security standard wrongly claimed was
      already there. Corrected 8 stale pin comments, all API-resolved.

  W2-orange:
    pr: https://github.com/hannosirkel/orange/pull/23
    merged: true
    ci: pass
    baseline: >-
      ruff 127 findings, 125 directives across 41 files (SIM117 x33, I001 x31,
      ISC004 x18 leading); shellcheck 8 findings, all narrow directives;
      markdownlint MD013 x165 and MD060 x212, the only two rules that fire.
    verified_no_logic_change: >-
      Independently, by the orchestrator. Across 46 changed code files, only
      scripts/validate differs once comments, blank lines and suppression
      directives are normalised away — and that file is the gate itself.
    note: >-
      ruff.toml carries extend-include for 11 extensionless Python commands,
      and scripts/validate compares `ruff check --show-files` against every
      tracked python-shebang file, so a twelfth cannot be silently unlinted.
      That guard caught a real fixture the plain gate missed.
  W2-orange-inventory:
    pr: https://github.com/hannosirkel/orange-inventory/pull/10
    merged: true
    ci: pass
    follow_up_pr: https://github.com/hannosirkel/orange-inventory/pull/11
    note: >-
      The shell gate was missed by wave 2's scope and only became visible once
      the false pass below was fixed. Added in PR 11: zero pre-existing
      findings, so the gate starts clean rather than with a backlog.

  W2-architecture:
    pr: https://github.com/hannosirkel/architecture/pull/8
    merged: true
    content: zizmor over its own workflows
    findings_fixed: >-
      Five artipacked findings: every actions/checkout persisted the token into
      .git/config, where a later step or an uploaded artifact can reach it. No
      job here pushes. Fixed rather than suppressed, because the standard
      baselines history and not defects in the work it is adding.
    fixture: an unpinned @v7 produces error[unpinned-uses] and exit 14

wave_1:
  findings: 13
  repositories_audited: 11
  skipped: [nomadtty]
  breakdown: >-
    12 missing-gate items, which are wave 2's job; orange-inventory's known
    docs blocker; and two agents-md-over-target reports, which pass.
  tooling_fix: >-
    Merging wave 1 exposed that the audit read working trees rather than
    origin/<default_branch>, so it reported 46 findings for files that were on
    the branch. Fixed in PR 5. 46 became 14, then 13 once architecture's own
    branch merged.

top_tier_review:
  tier: top
  runtime: claude-code
  at: "2026-08-21T23:20:00Z"
  scope: >-
    Repository ownership and source-of-truth conflicts, public and private
    boundary decisions, the three load-bearing documents, exceptions that weaken
    a baseline, security policy, and proportionality. §11 and §16 item 13.
  verdict: approve conditionally, blocking on the direct-push audit
  defects_found: 6
  defects_fixed: 6
  evidence: evidence/top-tier-review.md
  merged_as: https://github.com/hannosirkel/architecture/pull/2
  note: >-
    Two of the six were invisible to self-checking. The security standard
    asserted a fact taken from an evidence file the same agent wrote, and the
    CLI crashed on a subcommand no test invoked. §16 item 13 is satisfied for
    the three load-bearing documents.

