deferred:
  - item: >-
      Three repositories carry a stale comment reading "actions/checkout v4.2.2"
      beside SHA 3d3c42e5aac5ba805825da76410c181273ba90b1, which is v7.0.1.
      standards/security.md calls a wrong comment worse than none, so the
      universe knowingly violates its own standard until this lands.
    handling: correct the comments in wave 2 workflow hardening
  - item: >-
      servitium/.github/workflows/deploy-test.yml has no top-level permissions
      block, only job-level ones. A job added later would inherit the repository
      default rather than nothing.
    handling: add it in wave 2; recorded in standards/security.md
  - item: >-
      deploys' kubeconform step resolves schemas from kubernetes-json-schema at
      master, unpinned to a Kubernetes version, so the gate's strictness can
      drift with upstream and it depends on network reachability.
    handling: pin -kubernetes-version in wave 2
  - item: >-
      nomadtty's Playwright spec calls `openssl x509 -req -not_before/-not_after`,
      which the runner's OpenSSL rejects. Publish gates on CI success, so
      releases are blocked. Surfaced by the repository's first-ever CI run.
    handling: ordinary follow-up work in nomadtty, routed by §5.8
  - item: >-
      Four Habit Hooks coaching findings on tooling/ are accepted and
      deliberately not snoozed. Snoozing code written in the same pull request
      is the gaming the standard warns against.
    handling: ordinary follow-up in architecture

