    handling: ordinary follow-up in architecture
  - item: >-
      servitium's AGENTS.md Architecture section lists three frontend
      applications. It serves four: /dice, /chess, /mtg, and /ludus. Verified
      against src/, the server routes, and the vite configs.
    handling: >-
      ordinary follow-up in servitium. Out of scope for wave 1, which does not
      rewrite a section it was told to keep.
  - item: >-
      plepic's AGENTS.md Toolchain section says the storefront "chooses its own
      TypeScript version when it lands". It has landed. The pin rationale itself
      is still accurate; only the tense is wrong.
    handling: ordinary follow-up in plepic
  - item: >-
      servitium does not ignore the public/assets/ directory that npm ci
      generates. A routine `git add -A` there would commit build output.
    handling: ordinary follow-up in servitium
  - item: >-
      robobook's .claude/skills/ and .opencode/skills/ are single symlinks to
      skills/<name>/SKILL.md, not drift — deliberate per-runtime adapters with
      one source of truth. But only SKILL.md is linked, and every SKILL.md ends
      with `Read references/<name>.md`, a path relative to the skill directory.
      Through the adapter it resolves only if the runtime follows the symlink to
      its real path first. If it does not, the agent proceeds without the parser
      rules, on money-sensitive bookkeeping logic.
    handling: >-
      ordinary follow-up in robobook, and worth doing early. First step: invoke
      one skill through Claude Code and through opencode and observe whether
      references/<name>.md is actually read. Then either symlink references/ and
      agents/ beside each SKILL.md, or make that line a repository-root path.
      Not verified by this initiative; reasoned from the layout.
  - item: >-
      orange-inventory's docs/recovery.md, docs/platform.md, and
      docs/operations.md have not moved into docs/current/. Blocked by active
      working plans that name the paths and by scripts/validate's required_paths
      list. The audit reports missing-docs until both clear.
    handling: >-
      Revisit after the legacy-vm work completes. Wave 2 may edit
      scripts/validate, but §5.7 protects the active plans regardless, so the
      move waits on their owner rather than on wave 2.
  - item: >-
      nomadtty's .github/prompts/*.prompt.md (6 files) still point at the removed
      docs/ai/ and .github/instructions/ paths, as do comments in install.sh and
      docker-entrypoint.sh. Wave 1 could not touch .github/ or scripts.
    handling: ordinary follow-up in nomadtty; listed in its upstream.md
  - item: >-
      The generated managed section prints the universe-wide Habit Hooks install
      command in every repository, including those declaring no language. That
      is correct — extras replace rather than add, so a per-repository extras
      list would silently disable another repository's plugin — but the wording
      does not say so, and an agent in deploys may read it as a mistake.
    handling: >-
      reword templates/agent-baseline.md during wave 2, which re-verifies every
      repository's generated content anyway. Changing it now would mark ten open
      pull requests stale for a clarity nudge.


