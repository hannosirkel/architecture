cold_test:
  required_by: §16 item 20
  at: "2026-08-22"
  repositories: [deploys, orange, mihkel]
  method: >-
    Three fresh agents, one repository each, no other repository and no network.
    Seven questions, answered from that repository alone, with a gap to be
    reported rather than guessed.
  result: six of seven, three times
  evidence: evidence/cold-test.md
  findings_fixed:
    - >-
      Every checkout was stale with a clean git status, so the governance layer
      was invisible from the working tree. All three named it first. Nine
      checkouts fast-forwarded; ai-portal and portfolio-bot had an unborn HEAD
      and were an empty directory to a reader, and are now on main.
      orange-inventory was left alone, carrying another session's work.
    - >-
      Two of three could not say where a working plan belongs. work-routing.md
      was owner-facing so nothing linked it, and mihkel's governance merge had
      deleted the only local file that carried the answer. Every section now
      links it and states the answer outright.
  findings_routed:
    - >-
      deploys holds 3,376 lines of Ruby in heredocs, undeclared and ungated.
      shellcheck lints 19 lines of 3,246. The two dead assertions already found
      live in the part no gate can see.
    - orange's documentation never mentions Plepic.
    - >-
      scripts/validate passing no longer means a green pull request; wave 2
      added CI jobs the local script does not run.
    - >-
      mihkel's WORKFLOWS.md contradicts its own managed section on whether to
      push to main. The governance merge did not update it.
    - >-
      mihkel is public and carries RFC1918 addresses, an internal hostname, and
      a live n8n workflow ID. None is a secret value and gitleaks passes them.
      Nothing records that the exposure was considered and accepted.
  note: >-
    No mechanical check could have found the stale checkouts. Every audit reads
    origin/<default_branch> by design, so the audit was right while the
    workstation was wrong. That is the gap the cold test exists to cover.

findings_from_the_new_gates:
  - repository: architecture
    severity: high
    finding: >-
      The audit's gate detection matched a bare word, so a suppression
      directive counted as a gate. orange and orange-inventory both contain
      `# shellcheck disable=SC1091` in scripts/validate, and both were reported
      as gated while shellcheck ran nowhere.
    why_it_matters: >-
      This is a false pass, not a false failure. A false failure gets
      investigated because it is in the way. A false pass is a green tick
      nobody looks behind — the same shape as the generic-only Habit Hooks
      config that scans nothing and reports success, which decisions/006 exists
      to prevent.
    found_by: the wave 2 agent working on orange, by checking rather than trusting
    fixed: https://github.com/hannosirkel/architecture/pull/10
    handling: >-
      Comments are stripped before matching, and a linter counts only where it
      appears as a command. Five tests now cover it, including a suppression
      directive and a step named after the tool.

  - repository: deploys
    severity: high
    finding: >-
      Two assertions in servitium/tests/manifests.sh cannot fail. Both are
      written `! grep -q ...`, and shellcheck's SC2251 is exactly right about
      it: the `!` exempts the command from errexit, so the script continues and
      exits 0 whichever way the grep goes.
    verified: >-
      Empirically, not from the rule text. A three-line reproduction under
      `set -euo pipefail` runs past the negated assertion and exits 0.
    what_they_were_guarding:
      - >-
        Line 14: that a rendered overlay does not carry the placeholder digest
        sha256:0000... An unpromoted placeholder would reach Argo CD unchallenged.
      - >-
        Line 29: that the test overlay does not mount the live secret
        `servitium-secrets` instead of `servitium-test-secrets`. This is a
        cross-environment secret isolation check, and it cannot fail.
    handling: >-
      Ordinary follow-up in deploys, and it should be prompt. Wave 2 correctly
      baselined rather than fixed it: correcting the assertion changes the
      script's behaviour, which is outside a governance change. The fix is
      `if grep -q ...; then echo ...; exit 1; fi` or `grep -qv`, with a test
      that proves the assertion now fails.
    note: >-
      The shellcheck gate found this on its first run, in a repository whose
      whole job is to be the safe path to production.

deferred:
  - item: >-
      Three repositories carry a stale comment reading "actions/checkout v4.2.2"
      beside SHA 3d3c42e5aac5ba805825da76410c181273ba90b1, which is v7.0.1.
      standards/security.md calls a wrong comment worse than none, so the
