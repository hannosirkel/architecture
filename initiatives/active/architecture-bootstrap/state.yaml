wave_0:
  W0-1-deploys:
    pr: https://github.com/hannosirkel/deploys/pull/17
    branch: governance/wave0-controls
    content: gitleaks in CI, kubeconform behind the existing dry-run build
    ci: pass
    evidence: kubeconform rejected a scalar `resources:` field; fixture reverted
  W0-2-myskills:
    pr: https://github.com/hannosirkel/myskills/pull/2
    branch: governance/wave0-ci
    content: first CI workflow; shellcheck plus gitleaks plus the existing tests
    ci: pass
    baselined: 14 shellcheck findings (1 SC2209, 13 SC2015)
    note: >-
      The 13 SC2015 use one file-scoped directive in tests/install_test.sh
      rather than 13 line directives. New SC2015 in that one file will not be
      caught; every other rule in it still blocks.
  W0-3-nomadtty:
    pr: https://github.com/hannosirkel/nomadtty/pull/1
    branch: governance/wave0-harden
    content: seven actions pinned to commit SHAs; least-privilege permissions blocks
    ci: 3 of 4 pass
    ci_note: >-
      Playwright fails on a pre-existing portability bug: the spec calls
      `openssl x509 -req -not_before/-not_after`, which the runner's OpenSSL
      does not accept. This is the repository's first-ever CI run, so the PR
      surfaced a latent bug rather than breaking a green build. Not caused by
      the permissions change. Publish gates on CI success, so releases are
      blocked until it is fixed. Route as separate follow-up work in nomadtty.
  W0-4-robobook:
    pr: https://github.com/hannosirkel/robobook/pull/5
    branch: governance/wave0-ci
    content: first CI workflow; gitleaks plus the existing 237 unittest tests
    ci: pass
  W0-5-entpass:
    pr: https://github.com/hannosirkel/entpass/pull/1
    branch: governance/wave0-ci
    content: first CI workflow; gitleaks only
    ci: pass
  W0-6-architecture-ci:
