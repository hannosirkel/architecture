# The managed universe.
#
# A repository is governed because it appears here. Membership does not depend
# on any file inside the repository. See standards/repository-contract.md.
#
# `languages` is populated from evidence. It selects the language standards the
# generated AGENTS.md section links, the linters that gate CI, and the Habit
# Hooks plugins the coaching instruction names.
#
# Validate with:  tooling/universe validate

schema_version: 1

repositories:
  architecture:
    description: Engineering governance for the managed universe.
    profile: governance-private
    remote: https://github.com/hannosirkel/architecture.git
    local_path: "~/app/architecture"
    default_branch: main
    declared_visibility: private
    current_remote_visibility: private
    public_safe_required: false
    publication_status: not-applicable
    languages: [python]
    npm_project: false
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "bfc5130"
      # standards/agent-operation.md: durable initiative state is a coordination
      # record, not a code change. Gating it behind review would stall the
      # resume path it exists to protect.
      allowed_paths: ["initiatives/"]
    supports_rulesets: false

  orange:
    description: Reusable public-safe infrastructure implementation for Orange.
    profile: platform-public-ready
    remote: https://github.com/hannosirkel/orange.git
    local_path: "~/app/orange"
    default_branch: main
    declared_visibility: public
    current_remote_visibility: private
    public_safe_required: true
    publication_status: currently-private
    languages: [ansible, python, shell]
    npm_project: false
    supports_rulesets: false
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "4d052d3"

  orange-inventory:
    description: Private live inventory and operating state for Orange.
    profile: inventory-private
    remote: https://github.com/hannosirkel/orange-inventory.git
    local_path: "~/app/orange/inventory"
    default_branch: main
    local_checkout_note: checked out at orange/inventory; a separate repository, not a submodule
    declared_visibility: private
    current_remote_visibility: private
    public_safe_required: false
    publication_status: not-applicable
    languages: [ansible, shell]
    npm_project: false
    supports_rulesets: false
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "2983860"

  deploys:
    description: Public GitOps desired state reconciled by Argo CD.
    profile: gitops-public
    remote: https://github.com/hannosirkel/deploys.git
    local_path: "~/app/deploys"
    default_branch: main
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    visibility_reason: >-
      Public because the GitHub plan does not offer private Argo CD source
      access. An operator decision, already made.
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "fb300dd"
      # standards/security.md: main receives automated image digest pushes from
      # the plepic and servitium release workflows. A pull-request rule breaks
      # promotion, so these commits are expected rather than a violation.
      allowed_subject_pattern: '^deploy\((test|live)\): '
    languages: [shell]
    npm_project: false
    supports_rulesets: true

  myskills:
    description: Reusable executable agent skills and plugins.
    profile: skills-private
    remote: https://github.com/hannosirkel/myskills.git
    local_path: "~/app/myskills"
    default_branch: main
    declared_visibility: private
    current_remote_visibility: private
    public_safe_required: false
    publication_status: candidate
    languages: [shell]
    npm_project: false
    supports_rulesets: false
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "12c8092"

  plepic:
    description: plepicgames.com Medusa store and storefront.
    profile: application-public
    remote: https://github.com/hannosirkel/plepic.git
    local_path: "~/app/plepic"
    default_branch: main
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    languages: [typescript, shell]
    npm_project: true
    extra_standards: [gitops-and-deployment.md]
    supports_rulesets: true
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "97d5ba2"

  robobook:
    description: Bookkeeping workflow for Plepic Games OÜ.
    profile: application-public
    remote: https://github.com/hannosirkel/robobook.git
    local_path: "~/app/robobook"
    default_branch: main
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    languages: [python]
    npm_project: false
    supports_rulesets: true
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "1d31cc8"

  servitium:
    description: servitium.future.ee source and application documentation.
    profile: application-public
    remote: https://github.com/hannosirkel/servitium.git
    local_path: "~/app/servitium"
    default_branch: main
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    languages: [typescript, shell]
    npm_project: true
    extra_standards: [gitops-and-deployment.md]
    supports_rulesets: true
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "3d7f3b2"

  nomadtty:
    description: Maintained fork of NomadTTY.
    profile: fork-public
    remote: https://github.com/hannosirkel/nomadtty.git
    local_path: "~/app/nomadtty"
    default_branch: main
    is_fork: true
    upstream: https://github.com/nomadtty/nomadtty
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    languages: [typescript, shell]
    npm_project: true
    supports_rulesets: true
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "3eba321"
    fork_posture: >-
      Upstream contribution is not expected. Apply the full governance baseline
      and record the added files in the delta documentation.

  mihkel:
    description: OpenClaw-based Mihkel agent operating through Discord.
    profile: application-public
    remote: https://github.com/hannosirkel/mihkel.git
    local_path: "~/app/mihkel"
    default_branch: main
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    languages: [typescript, python, shell]
    npm_project: false
    supports_rulesets: true
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "fa0dd76"

  ai-portal:
    description: ai.future.ee and its subprojects. Unimplemented.
    profile: application-public
    remote: https://github.com/hannosirkel/ai-portal.git
    local_path: "~/app/ai-portal"
    default_branch: main
    default_branch_state: unborn
    declared_visibility: public
    current_remote_visibility: public
    public_safe_required: true
    publication_status: published
    languages: []
    npm_project: false
    lifecycle: registered-not-implemented
    supports_rulesets: true

  entpass:
    description: EntityPass/LEI concept research and development.
    profile: research-private
    remote: https://github.com/hannosirkel/entpass.git
    local_path: "~/app/entpass"
    default_branch: main
    declared_visibility: private
    current_remote_visibility: private
    public_safe_required: false
    publication_status: not-applicable
    languages: []
    npm_project: false
    lifecycle: early-research
    supports_rulesets: false
    direct_push:
      # Direct pushes at or before this commit predate the rule and are
      # baselined, exactly as a linter baseline records today's findings.
      baseline_commit: "149bc56"

