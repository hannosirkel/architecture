# Link checking for the architecture repository.
#
# Checks internal links strictly. External links are checked except where the
# answer would be meaningless.

exclude_path = [
  # A template, not a document. Its links carry {{placeholders}} that only
  # resolve once the generator substitutes them.
  "templates/agent-baseline.md",
  "templates/claude-md-pointer.md",
]

exclude = [
  # Five repositories are private. An anonymous checker gets 404 for one that
  # exists, which is a false failure here rather than a finding.
  #
  # architecture is deliberately not among them any more. Every standards link
  # the generated baseline carries points there, and those links are now
  # checked for real — which is the point of it being public.
  "^https://github\\.com/hannosirkel/(orange|orange-inventory|myskills|entpass|portfolio-bot)(/|$)",
]

# GitHub rate-limits anonymous requests hard enough to make a run flaky.
max_concurrency = 4
max_retries = 2
timeout = 20

accept = ["200", "204", "206", "429"]
