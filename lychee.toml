# Link checking for the architecture repository.
#
# Checks internal links strictly. External links are checked except where the
# answer would be meaningless.

exclude_path = [
  # A template, not a document. Its links carry {{placeholders}} that only
  # resolve once the generator substitutes them.
  "templates/agent-baseline.md",
  "templates/claude-md-pointer.md",
]

exclude = [
  # Six repositories are private. An anonymous checker gets 404 for one that
  # exists, which is a false failure here rather than a finding.
  #
  # Be honest about what this hides: for a reader outside this account those
  # links really are dead, and excluding them means the checker never says so.
  # The generated AGENTS.md section says it in words instead, and states the
  # load-bearing rules inline so an outside reader can act correctly without
  # them.
  "^https://github\\.com/hannosirkel/(architecture|orange|orange-inventory|myskills|entpass|portfolio-bot)(/|$)",
]

# GitHub rate-limits anonymous requests hard enough to make a run flaky.
max_concurrency = 4
max_retries = 2
timeout = 20

accept = ["200", "204", "206", "429"]
